          <style>
            .cb { animation: cubeBreathe 7s ease-in-out infinite; }
            .cb .t { fill:#1B2C50; }
            .cb .r { fill:#13223F; }
            .cb .l { fill:#0E182F; }
            .cb polygon { stroke:#2E5C8C; stroke-width:1.1; stroke-linejoin:round; }
            @keyframes cubeBreathe { 0%,100%{opacity:.8} 50%{opacity:1} }
            .s0 .t,.s1 .t,.s2 .t { animation: cubeHlT 9s ease-in-out infinite; }
            .s0 .r,.s1 .r,.s2 .r { animation: cubeHlR 9s ease-in-out infinite; }
            .s0 .l,.s1 .l,.s2 .l { animation: cubeHlL 9s ease-in-out infinite; }
            .s0 polygon { animation-delay: 0s; }
            .s1 polygon { animation-delay: 3s; }
            .s2 polygon { animation-delay: 6s; }
            @keyframes cubeHlT { 0%,6%{fill:#1B2C50;stroke:#2E5C8C} 13%,22%{fill:#463617;stroke:#E3B341} 32%,100%{fill:#1B2C50;stroke:#2E5C8C} }
            @keyframes cubeHlR { 0%,6%{fill:#13223F;stroke:#2E5C8C} 13%,22%{fill:#35280F;stroke:#E3B341} 32%,100%{fill:#13223F;stroke:#2E5C8C} }
            @keyframes cubeHlL { 0%,6%{fill:#0E182F;stroke:#2E5C8C} 13%,22%{fill:#281D0A;stroke:#E3B341} 32%,100%{fill:#0E182F;stroke:#2E5C8C} }
            .cb.fact .t { animation:none; fill:#6A5220; stroke:#E3B341; stroke-width:1.4; }
            .cb.fact .r { animation:none; fill:#4A3716; stroke:#E3B341; stroke-width:1.4; }
            .cb.fact .l { animation:none; fill:#382910; stroke:#E3B341; stroke-width:1.4; }
            .fact { filter:url(#cubeGlow); animation: cubePulse 2.8s ease-in-out infinite; }
            @keyframes cubePulse { 0%,100%{opacity:.86} 50%{opacity:1} }
            @media (prefers-reduced-motion: reduce) {
              .cb, .cb polygon, .fact { animation:none !important; }
            }
          </style>

